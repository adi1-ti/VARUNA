<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Speckled SAR / Optical ocean texture -->
    <radialGradient id="sarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.15 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="320" height="180" fill="url(#sarBg)" />

  <!-- SAR Ocean Wave Speckle Patterns -->
  <g opacity="0.4" stroke="#475569" stroke-width="0.5">
    <line x1="20" y1="30" x2="100" y2="35" stroke-dasharray="8 4" />
    <line x1="140" y1="25" x2="280" y2="30" stroke-dasharray="12 6" />
    <line x1="10" y1="65" x2="120" y2="70" stroke-dasharray="6 3" />
    <line x1="200" y1="60" x2="310" y2="65" stroke-dasharray="10 5" />
    <line x1="30" y1="120" x2="150" y2="125" stroke-dasharray="7 4" />
    <line x1="180" y1="115" x2="300" y2="120" stroke-dasharray="9 5" />
    <line x1="10" y1="155" x2="130" y2="160" stroke-dasharray="8 4" />
    <line x1="170" y1="150" x2="290" y2="155" stroke-dasharray="11 6" />
  </g>

  <!-- Vessel Wake Turbulence (V-shaped hydrodynamic stern wake) -->
  <path d="M 100,90 L 30,70 Q 20,85 10,80 Q 20,95 30,110 L 100,90 Z" fill="rgba(148, 163, 184, 0.18)" />
  <path d="M 90,90 L 20,65" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />
  <path d="M 90,90 L 20,115" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />

  <!-- High-Resolution Vessel Hull (Optical / SAR Bright Return) -->
  <!-- Main Hull Outline -->
  <path d="M 115,84 L 195,84 Q 215,86 225,90 Q 215,94 195,96 L 115,96 Q 110,94 110,90 Q 110,86 115,84 Z" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1" />
  
  <!-- Deck Superstructure & Cargo Tank Hatches -->
  <rect x="118" y="86" width="14" height="8" fill="#475569" />
  <circle cx="140" cy="90" r="2.5" fill="#334155" />
  <circle cx="152" cy="90" r="2.5" fill="#334155" />
  <circle cx="164" cy="90" r="2.5" fill="#334155" />
  <circle cx="176" cy="90" r="2.5" fill="#334155" />
  <circle cx="188" cy="90" r="2.5" fill="#334155" />
  <polygon points="208,88 218,90 208,92" fill="#64748b" />

  <!-- Target Bounding Box (Amber Orange) matching reference image -->
  <rect x="104" y="74" width="128" height="32" fill="none" stroke="#f97316" stroke-width="1.8" />
  
  <!-- Corner Target Markers -->
  <line x1="104" y1="74" x2="112" y2="74" stroke="#fbbf24" stroke-width="2.5" />
  <line x1="104" y1="74" x2="104" y2="82" stroke="#fbbf24" stroke-width="2.5" />
  
  <line x1="232" y1="74" x2="224" y2="74" stroke="#fbbf24" stroke-width="2.5" />
  <line x1="232" y1="74" x2="232" y2="82" stroke="#fbbf24" stroke-width="2.5" />

  <line x1="104" y1="106" x2="112" y2="106" stroke="#fbbf24" stroke-width="2.5" />
  <line x1="104" y1="106" x2="104" y2="98" stroke="#fbbf24" stroke-width="2.5" />

  <line x1="232" y1="106" x2="224" y2="106" stroke="#fbbf24" stroke-width="2.5" />
  <line x1="232" y1="106" x2="232" y2="98" stroke="#fbbf24" stroke-width="2.5" />

  <!-- Technical Telemetry Overlays -->
  <text x="10" y="16" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">RES: 0.5m GSD | SENSOR: SPOTLIGHT SAR / OPTICAL FUSION</text>
  <text x="10" y="172" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">UTC: 2026-02-09 14:35:22 | TGT#42 L:185m W:28m</text>
  <text x="210" y="172" fill="#f97316" font-size="8" font-family="JetBrains Mono, monospace" font-weight="bold">CONF: 92%</text>
</svg>
