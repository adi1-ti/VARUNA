  <line x1="80" y1="50" x2="94" y2="50" stroke="#18B6A4" stroke-width="2" />
  
  <!-- Ocean Waves & Central Trident/Beacon -->
  <path d="M26 62 Q38 52 50 62 T74 62" stroke="#3987C9" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M32 70 Q41 62 50 70 T68 70" stroke="#18B6A4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Central Vessel/Trident Beacon -->
