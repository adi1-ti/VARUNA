  </defs>
  <!-- Outer radar ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#varunaGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="50" cy="50" r="36" stroke="#102B40" stroke-width="1.5" />
  <circle cx="50" cy="50" r="24" stroke="#18B6A4" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  
