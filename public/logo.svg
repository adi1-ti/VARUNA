      <stop offset="0%" stop-color="#18B6A4" />
      <stop offset="100%" stop-color="#3987C9" />
    </linearGradient>
    <linearGradient id="varunaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18B6A4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18B6A4" stop-opacity="0" />
